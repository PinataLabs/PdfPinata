name: Build and Test

on:
  # A branch with a pull request open is covered by the pull_request trigger below. Building it
  # here as well would run everything twice for the same commit.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # So that a branch with no pull request open can still be built, on request.
  workflow_dispatch:

# This repository hands workflows a read/write token by default, and nothing here writes anything:
# it checks out, builds, tests, and hands coverage to Codecov using a token of Codecov's own. So the
# job runs with a token that can only read the code. A pull request from a fork is already held to
# read - the point of saying it here is the push to main, which is not.
#
# Naming any permission drops every other one to none, so a step that later needs to write will fail
# rather than quietly succeed with rights nobody asked for. Grant it here when that happens. The one
# already in view is use_oidc on the Codecov step, an alternative to the token secret, which would
# want id-token: write.
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    # A pull request from a fork is not given the repository's secrets, so SONAR_TOKEN is empty
    # there and every SonarCloud step below skips itself. The build and tests still run.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # MinVer reads the version from the most recent tag, so it needs the history and the tags.
      # A shallow clone has neither, and every build would be versioned as if nothing had been
      # released.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # The SonarScanner for .NET runs on Java, 17 or later.
      - name: Set up JDK 17
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@v5.7.0
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Cache SonarCloud packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v6
        with:
          path: ~/sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Install SonarCloud scanner
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner
      # A Release build: it compiles every leg and, through GeneratePackageOnBuild, packs every
      # package, so a project that no longer packs fails here rather than at release time. The
      # tests below build and run the Debug configuration, where Debug.Assert is live.
      - name: Build
        run: dotnet build src/PdfPinata.slnx --configuration Release
      # A package with a published vulnerability anywhere in the dependency graph fails the build,
      # so it cannot reach a release without somebody deciding that it should.
      - name: Check vulnerable packages
        run: |
          OUTPUT=$(dotnet list src/PdfPinata.slnx package --vulnerable --include-transitive --format json)
          echo "$OUTPUT"
          if echo "$OUTPUT" | jq -e '.projects[] | select(.frameworks)' > /dev/null 2>&1; then
            echo "::error::Vulnerable packages detected"
            exit 1
          fi
      # The Ghostscript.NativeAssets package covers Windows, where ImageMagick loads the
      # Ghostscript DLL in process. On Linux it shells out to the system "gs" delegate instead,
      # so the visual comparison tests still need Ghostscript installed here.
      #
      # The runner image ships a package index from when the image was built. Once Ubuntu publishes
      # a newer security update, the archive drops the version that index names, and installing
      # from it fails with 404s. Refreshing the index first also covers the AOT step's install below.
      - name: Install Ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript
      # SonarCloud analyses what is compiled between "begin" and "end", so exactly one build sits
      # between them: the Debug build the tests run against. The Release build above stays outside,
      # or every project would be analysed twice. The coverage the tests write is the same OpenCover
      # output Codecov reads below - one file per test project and framework, under that project's
      # TestResults, which is what the wildcard in reportsPaths is reaching for.
      #
      # SonarCloud's Automatic Analysis must be off for this project, or it refuses a CI analysis.
      #
      # Coverage is not measured for the demonstration app or the documentation website: neither
      # ships, the SampleApp's demos are run by DemoSmokeTests for what they produce rather than
      # for coverage, and the site's scripts have no tests at all. coverage.runsettings keeps those
      # assemblies out of the report in the first place; this keeps their files from counting as
      # uncovered here.
      - name: Begin SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet sonarscanner begin
          /k:"PinataLabs_PdfPinata"
          /o:"pinatalabs"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/coverage*.opencover.xml"
          /d:sonar.coverage.exclusions="src/ConformanceCorpus/**,src/PinataLayout.AotSmokeTest/**,src/SampleApp/**,docs-website/**"
      - name: Build for tests
        run: dotnet build src/PdfPinata.slnx --configuration Debug --no-restore
      # Coverage is collected by coverlet's data collector, not by its MSBuild driver, and the
      # difference is not cosmetic. /p:CollectCoverage=true has each instrumented assembly write its
      # hit counts to a temp file as the test host exits, and reads them back once the run is over -
      # but VSTest tears the host down the moment the run reports complete. An assembly that has not
      # flushed yet leaves no file, which coverlet reports as 0% and mentions only at verbosity
      # "verbose", or leaves half a file, which ends the step with "Unable to read beyond the end of
      # the stream". A different handful of assemblies lost it on every run, and PdfPinata.EInvoice
      # lost it on both frameworks at once, so it read 0% on Codecov and SonarCloud for months with
      # all of its tests passing. The collector reports from inside the test host, where there is
      # nothing left to race.
      #
      # coverage.runsettings is the file a developer runs locally, so CI and a local run now measure
      # the same thing: no test, benchmark or demonstration assembly, no generated file, nothing
      # marked [ExcludeFromCodeCoverage]. Only the format differs - OpenCover alone here, because
      # that is what SonarCloud and Codecov both read, where locally it also writes Cobertura for
      # ReportGenerator's CRAP scores.
      - name: Test
        run: dotnet test src/PdfPinata.slnx --no-build --verbosity normal --settings coverage.runsettings --collect:"XPlat Code Coverage;Format=opencover"
      - name: End SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      # The DOM's value model is generated rather than reflected for, and EnableTrimAnalyzer proves
      # no statically visible reflection is left. It cannot prove there is none at all, nor that the
      # result runs. Publishing native and running it does. The app returns non-zero if any check
      # fails, so this step is the gate.
      - name: AOT smoke test
        run: |
          sudo apt-get install -y clang zlib1g-dev
          dotnet publish src/PinataLayout.AotSmokeTest/PinataLayout.AotSmokeTest.csproj -c Release -r linux-x64
          ./src/PinataLayout.AotSmokeTest/bin/Release/net10.0/linux-x64/publish/PinataLayout.AotSmokeTest
      # Every PDF/A and PDF/UA claim this library makes is otherwise self-certified: the writer
      # refuses to save a document that breaks a rule it can check, and PdfUaValidator says in its own
      # remarks which rules it cannot reach. This is the outside opinion, and it is the same script a
      # developer runs locally - one behaviour to understand rather than two.
      #
      # This gates, and no continue-on-error: a step that cannot fail is a step that is not checking
      # anything. It reported without failing for exactly as long as the corpus did not conform,
      # which was the three defects the first run found - all since fixed, all with tests of their
      # own, and docs/specs/verapdf-validation.md says what each of them was.
      #
      # A validator that will not start fails this too, because CI is set here: a validation step
      # that quietly validates nothing is how a claim goes back to being self-certified without
      # anybody deciding that it should.
      - name: veraPDF conformance
        shell: pwsh
        run: ./verapdf-check.ps1
      - name: Upload veraPDF reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verapdf-reports
          path: artifacts/verapdf-reports/
          if-no-files-found: warn
      # v4 replaced the old uploader binary with the Codecov CLI, and with it the rules about
      # tokens. The old uploader took this repository's coverage without one; the CLI answers
      # "Token required because branch is protected" and drops it. So the token below is not
      # belt and braces - without the secret behind it there is no coverage on codecov.io at all,
      # and the secret is the only part of this that cannot be set from here.
      #
      # It fails quietly by design: fail_ci_if_error is left at its default of false because a
      # coverage upload is a report about the build rather than a verdict on it. The cost is that
      # a rejected upload shows in this step's log and nowhere else - the step still goes green.
      #
      # The CLI searches the tree for reports rather than being handed them, which is why nothing
      # here names a path: the collector writes into a directory named for a run it has just made
      # up. It lists what it found, so that log is where to look if a report ever goes missing.
      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
