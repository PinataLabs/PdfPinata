name: Docs

# Builds the documentation website in docs-website/ and publishes it to GitHub Pages.
#
# The site quotes the SampleApp's demos and shows the PDFs they make, so it depends on the library
# as well as on its own pages. A pull request builds it when the pages or the demos change, which is
# what catches an excerpt a demo edit has broken. A push to main deploys it on any change to the
# code, because a library change can change what every demo PDF looks like.
on:
  push:
    branches: [main]
    paths:
      - 'docs-website/**'
      - 'src/**'
      - 'assets/**'
      - 'global.json'
      - 'Directory.Build.*'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs-website/**'
      - 'src/SampleApp/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Nothing in the build job writes anything. The deploy job asks for what Pages needs on its own.
permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: docs-website

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    env:
      # A demo PDF or thumbnail that is missing fails the build rather than publishing a gallery of
      # placeholders. Locally, without .NET or Ghostscript, the site builds with placeholders.
      DOCS_REQUIRE_DEMOS: '1'
    steps:
      - uses: actions/checkout@v7

      # The SampleApp targets net8.0 and global.json pins the 10.0 SDK.
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Draws the first page of each demo PDF as the gallery's thumbnail. The index is refreshed
      # first because the runner image's own goes stale: once Ubuntu publishes a newer security
      # update, the archive drops the version it names and the install fails with 404s.
      - name: Install Ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript

      # Must precede setup-node: `cache: pnpm` needs the pnpm binary on PATH to
      # resolve the store path. The version comes from packageManager in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # There is no root package.json — the field lives in the docs project.
          package_json_file: docs-website/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-website/pnpm-lock.yaml

      - name: Install dependencies
        # No dependency needs a lifecycle script to build the site: only core-js
        # (a donation banner) and fsevents (macOS-only) declare one. pnpm 10 also
        # blocks dependency scripts by default, so this is belt and braces.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm run typecheck

      # Builds and runs the SampleApp, writing every demo PDF and its thumbnail into static/demos.
      - name: Render the demos
        run: pnpm run demos

      - name: Build
        run: pnpm run build

      - name: Upload Pages artifact
        # Only the production deploy needs the artifact; PRs just verify the build.
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-website/build

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
